name: Build Python Environment

on:
  push:
    paths: 
      - "env/**"
  workflow_dispatch:

permissions: 
  contents: write

jobs: 
  build: 
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      
      - name: Install tools
        run: |
          pip install uv pip-audit cyclonedx-bom pyyaml
      
      
      - name: Prepare dependencies
        run: python scripts/build_deps.py
        
      # Generate lock file
      - name: Generate uv.lock
        run: uv lock

      # Export requirements.txt with hashes
      - name: Export requirements.txt
        run: uv export --format requirements-txt -o artifacts/requirements.txt

      # Sync environment (for audit + sbom)
      - name: Install environment 
        run: uv sync

      # Run vulnerability scan
      - name: Run pip-audit 
        run: pip-audit
      
      # Generate SBOM
      - name: Generate SBOM
        run: cyclonedx-py environment -o artifacts/sbom.json 

      # Move uv.lock into artifacts 
      - name: Move lockfile 
        run: |
          mkdir artifacts -Force 
          move uv.lock artifacts/uv.lock

      # Commit artifacts back to repo 
      - name: Commit artifacts 
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
        
          git add artifacts/
          git commit -m "Update environment artifacts" || echo "No changes"
          git push
